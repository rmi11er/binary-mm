[project]
name = "binary-mm"
version = "0.1.0"
description = "Market making in event-contract binaries priced as digital options"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "polars>=1.0",
  "pyarrow>=16",
  "pydantic>=2.7",
  "ib_async>=2.1,<3",
  "structlog>=24",
  "matplotlib>=3.11.2",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6"]

[project.scripts]
bmm = "bmm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# analyze.py is owner-supplied and frozen (docs/plans/spotcheck.md); keep its noqa as-is.
"src/bmm/spotcheck/analyze.py" = ["RUF100"]
# report.py builds markdown from adjacent string literals inside lists on purpose.
"src/bmm/spotcheck/report.py" = ["ISC004"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "ib_async.*"]
ignore_missing_imports = true
